# Declarative Rime default schema (deployed system-wide via locales/zh-cn.nix).
# This ships as part of the shared rime data so no per-user config is required.
patch:
  menu/page_size: 9
  ascii_composer/switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
  schema_list:
    - schema: rime_ice

  # 候选框样式配置 - 让 fcitx5-rime 显示候选窗口
  style/font_family: "Noto Sans CJK SC"
  style/font_size: 14
  style/horizontal: true
  style/inline_preedit: false
  style/candidate_format: "%c\u2005%@\u2005"
  style/preedit_format: "%s"

  # 预设配色方案 (fcitx5-rime 需要)
  preset_color_schemes:
    nixos:
      name: NixOS
      text_color: 0x1a1a1a
      back_color: 0xffffff
      border_color: 0x6
      hilited_text_color: 0x000000
      hilited_back_color: 0xe8e8e8
      hilited_candidate_text_color: 0xffffff
      hilited_candidate_back_color: 0x0078d4
      candidate_text_color: 0x333333
      label_color: 0x666666

  color_scheme: nixos
