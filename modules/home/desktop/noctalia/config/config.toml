# Noctalia v5 配置 — SHORiN 外观迁移（保留 v4 的 bar/组件/字体/配色/壁纸风格）。
#
# 说明：
#   - v4 的 JSON settings 在此改为 TOML（v5 配置模型）。
#   - IPC/服务由官方 home 模块与 `noctalia msg` 接管。
#   - 壁纸配色原生生成（[theme].source = "wallpaper"），不再依赖 matugen。

[shell]
font_family = "LXGW WenKai"
lang = "zh_CN.UTF-8"
avatar_path = "~/.face"
telemetry_enabled = false
clipboard_enabled = true
launch_apps_as_systemd_services = true
app_icon_colorize = false
niri_overview_type_to_launch_enabled = false

# ---- panel 边框控制：关闭 borders 避免亮主题下出现描边 ----
[shell.panel]
borders = false
shadow = true

# ---- 主题：自动模式 + 壁纸取色 (m3 tonal-spot) ----
[theme]
mode              = "auto"
source            = "wallpaper"
wallpaper_scheme  = "m3-tonal-spot"
pure_black_dark   = false

# ---- 主题/壁纸变化时同步 GTK 应用 ----
[hooks]
theme_mode_changed = ["~/.config/noctalia/theme-sync.sh"]
wallpaper_changed = ["~/.config/noctalia/wallpaper-hook.sh"]

# ---- 位置（v4 location: Guangzhou）----
[location]
auto_locate = true
name = "Guangzhou;"
show_weather = true

# ---- 壁纸：Noctalia 壁纸用于配色提取，mpvpaper 插件接管视频播放 ----
[wallpaper]
enabled             = true
directory           = "/home/mccarnon/Pictures/Wallpapers"
fill_mode           = "crop"
transition          = ["fade", "disc", "stripes", "wipe", "pixelate", "honeycomb"]
transition_duration = 1500
edge_smoothness     = 0.3

[wallpaper.automation]
enabled = false

# ---- overview backdrop（niri 的 blurred+tint 壁纸背景，对应 v4 overview blur/tint）----
[backdrop]
enabled        = false
blur_intensity = 0.4
tint_intensity = 0.6

# ---- 顶栏：SHORiN 浮动胶囊风格 ----
[bar]
order = ["main"]

[bar.default]
position           = "top"
enabled            = true
auto_hide          = false
smart_auto_hide    = false
reserve_space      = true
background_opacity = 0.50
radius             = 16
margin_edge        = 0
margin_ends        = 0
padding            = 0
widget_spacing     = 12
scale              = 1.0
font_scale         = 1.0
capsule            = false
capsule_opacity    = 1.0
hover_highlight    = true
outer_corners      = false
edge_smoothness    = 0.3
start              = ["launcher", "clock", "sysmon_cpu", "sysmon_mem", "active_window", "media"]
center             = ["workspaces"]
end                = ["tray", "notifications", "battery", "volume", "brightness", "control-center"]

# ---- 组件：复刻 v4 的 SHORiN 配置 ----
[widget.launcher]
glyph = "rocket"

[widget.workspaces]
labels_only_when_occupied = true
focused_color             = "primary"
occupied_color            = "secondary"
empty_color               = "secondary"
hide_when_empty           = false

[widget.clock]
format = "{:%H:%M %a, %b %d}"

[widget.sysmon_cpu]
type    = "sysmon"
stat    = "cpu_usage"
show_glyph = true

[widget.sysmon_mem]
type       = "sysmon"
stat       = "memory_usage"
show_glyph = true

[widget.active_window]
title_scroll = "on_hover"
display      = "icon_and_text"
max_length   = 145

[widget.media]
artist_first   = true
hide_album_art = false
max_length     = 145
title_scroll   = "on_hover"

[widget.tray]
drawer       = true
hide_passive = false

[widget.battery]
display_mode = "graphic"
show_label   = true

# ---- mpvpaper 动态壁纸插件 widget（激活视频播放）----
[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

# ---- Dock：沿用 v4（底部、浮动、自动隐藏）----
[dock]
enabled             = true
position            = "bottom"
auto_hide           = true
background_opacity  = 0.88
radius              = 16
margin_ends         = 0
margin_edge         = 0
show_running        = true
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = true
reserve_space       = false
launcher_position   = "end"
launcher_icon       = "grid-dots"

# ---- OSD：位置沿用 v4 的 top_right ----
[osd]
position          = "top_right"
position_vertical = "center_right"
background_opacity = 0.97
border            = false
offset_x          = 20
offset_y          = 8

# ---- GTK Material You 模板（由 Noctalia 渲染到 gtk.css）----
[theme.templates.user.nyxniri_gtk3]
index = 3
input_path = "~/.config/noctalia/templates/gtk-3.0.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[theme.templates.user.nyxniri_gtk4]
index = 4
input_path = "~/.config/noctalia/templates/gtk-4.0.css"
output_path = "~/.config/gtk-4.0/gtk.css"

# ---- mpvpaper 动态壁纸插件（Noctalia 内置）----
[plugins]
enabled = ["noctalia/mpvpaper"]

[plugin_settings."noctalia/mpvpaper"]
mpv_options = ""
video_directory = "/home/mccarnon/Pictures/Wallpapers"
# 关闭 clear 时的"提取旧视频末帧当静态壁纸"：该过程是异步的，会在统一壁纸
# 选择器刚设好新静态图后把它覆盖（竞态）。置 false 后 clear 仅重新启用 Noctalia
# 静态壁纸层，让选择器后续的 wallpaper-set 稳定生效。
extract_last_frame = false
