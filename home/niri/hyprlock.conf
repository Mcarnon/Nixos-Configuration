# hyprlock — SHORiN minimal-niri 锁屏（原版）
# 颜色来自 hyprlock-colors.conf（Matugen 生成后硬编码在此，无运行时依赖）

source = ~/.config/niri/hyprlock-colors.conf

# 字体（NixOS 上用 maple-mono 的 "Maple Mono NF"）
$font = Maple Mono NF
$font_clock = Maple Mono NF

general {
    hide_cursor = false       # 锁屏时不隐藏鼠标光标
    ignore_empty_input = true # 输入框为空时按回车不显示"验证失败"
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot       # 使用当前屏幕截图作为背景（依赖 grim）
    color = $surface

    blur_size = 5
    blur_passes = 4
    noise = 0.01
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours（小时）
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $primary

    font_size = 130
    font_family = $font_clock

    shadow_passes = 3
    shadow_size = 4

    position = 0, 29%
    halign = center
    valign = center
}

# Minutes（分钟）
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $primary

    font_size = 130
    font_family = $font_clock

    shadow_passes = 3
    shadow_size = 4

    position = 0, 16%
    halign = center
    valign = center
}

# 星期几
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> $(date +'%A') </big></b>"
    color = $secondary

    font_size = 28
    font_family = $font

    position = 0, 7%
    halign = center
    valign = center
}

# 日期
label {
    monitor =
    text = cmd[update:18000000] echo "<b> $(date +'%b %d') </b>"
    color = $secondary

    font_size = 18
    font_family = $font

    position = 0, 4%
    halign = center
    valign = center
}

# 密码输入框
input-field {
    monitor =
    size = 9%, 3.1%
    outline_thickness = 2

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1

    rounding = 12

    outer_color = $primary $tertiary $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $secondary
    fail_color = $error

    fade_on_empty = false
    placeholder_text = <i>Password...</i>

    position = 0, 10%
    halign = center
    valign = bottom
}
