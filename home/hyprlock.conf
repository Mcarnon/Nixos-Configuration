# hyprlock — SHORiN-style lock screen, simplified.
#
# The original (shorin-arch-setup) sources colors from Matugen
# (hyprlock-colors.conf); we hardcode Catppuccin Mocha to match foot/fuzzel
# since Matugen/Clavis are gone.

general {
    hide_cursor = false       # 锁屏时不隐藏鼠标光标
    ignore_empty_input = true # 输入框为空时按回车不显示"验证失败"
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot       # 使用当前屏幕截图作为背景（需要 grim）
    color = rgba(30, 30, 46, 1)

    blur_size = 5
    blur_passes = 4
    noise = 0.01
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours（小时）
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgba(137, 180, 250, 1)

    font_size = 130
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 3
    shadow_size = 4

    position = 0, 29%
    halign = center
    valign = center
}

# Minutes（分钟）
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(137, 180, 250, 1)

    font_size = 130
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 3
    shadow_size = 4

    position = 0, 16%
    halign = center
    valign = center
}

# 星期几
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> $(date +'%A') </big></b>"
    color = rgba(205, 214, 244, 1)

    font_size = 28
    font_family = JetBrainsMono Nerd Font

    position = 0, 7%
    halign = center
    valign = center
}

# 日期
label {
    monitor =
    text = cmd[update:18000000] echo "<b> $(date +'%b %d') </b>"
    color = rgba(205, 214, 244, 1)

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 4%
    halign = center
    valign = center
}

# 密码输入框
input-field {
    monitor =
    size = 9%, 3.1%
    outline_thickness = 2

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1

    rounding = 12

    outer_color = rgba(137, 180, 250, 1) rgba(245, 194, 231, 1) rgba(137, 180, 250, 1)
    inner_color = rgba(49, 50, 68, 1)
    font_color = rgba(205, 214, 244, 1)
    check_color = rgba(166, 227, 161, 1)
    fail_color = rgba(243, 139, 168, 1)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>

    position = 0, 10%
    halign = center
    valign = bottom
}
