[main]
shell=fish

font=JetBrainsMono Nerd Font:size=13.5,Maple Mono NF CN:size=13.5

pad=5x5

# 新起的 foot 进程初始用哪套配色。
#
# foot 1.27 完全没有配置重载能力（二进制里没有任何 reload 路径，还明确 ignore
# SIGHUP），配置只在进程启动时读一次。所以运行中的窗口要靠信号切
# （SIGUSR1=暗 / SIGUSR2=亮，见 clavis-theme-sync），这个选项只管「启动那一刻」。
# 为了让切换后新开的窗口也能立刻对上，binds.kdl 走的是 foot-themed 包装脚本，
# 用 `foot -o initial-color-theme=<当前模式>` 覆盖这里的值。
initial-color-theme=dark

[cursor]
style=block
unfocused-style=hollow
blink=no

# ── 以下两节的配色由 matugen 从当前壁纸派生（scheme-tonal-spot）────────────
# 不是手挑的固定主题。换壁纸后想更新这两节，重跑一次生成即可（两节都要，
# 因为切换靠的是这两节各自独立存在）：
#
#   matugen --source-color-index 0 image <壁纸> --mode dark  --type scheme-tonal-spot --config <cfg>
#   matugen --source-color-index 0 image <壁纸> --mode light --type scheme-tonal-spot --config <cfg>
#
# 注意 foot 的 alpha 属于 [colors-*] 节，不属于 [main]，所以两节各写一份。
# dim 混合方向不用配：foot 对 colors-dark 默认混向 black、对 colors-light 默认混向 white。
#
# 可写的色号上界是 regular0-7 / bright0-7 / dim0-7 / sixel0-15，就这四组。
# 写 regular8 及以上会得到 `not valid option`，foot 直接把该行丢掉（终端仍能起，
# 但每次启动都会刷一堆 error）。256 色板的 16-255 号不是逐键可配的，foot 自己
# 推算。踩坑提示：foot.ini(5) 在这一段里把扩展色板的键名印成了字面的
# "0 .. 255"，看起来像是在说 regular0-255，实际不是 —— 别照着填。
[colors-dark]
background=0f1417
foreground=dfe3e7
regular0=0f1417
regular1=ffb4ab
regular2=c7c2ea
regular3=b4cad6
regular4=8ccff0
regular5=c7c2ea
regular6=b4cad6
regular7=dfe3e7
bright0=40484c
bright1=93000a
bright2=464364
bright3=354a54
bright4=004d65
bright5=354a54
bright6=464364
bright7=c0c8cd
# alpha 保持不透明的（1.0）：niri 侧已经没有全局透明度规则了（本仓库自加的
# opacity 0.9 / background-effect 那条 window-rule 已按「照抄上游」删除），
# 终端不透明就是上游默认的样子。Clavis 自己面板的玻璃感来自它的
# shellBackgroundOpacity + ext-background-effect，和终端 alpha 无关。
alpha=1.0

[colors-light]
background=f6fafe
foreground=171c1f
regular0=f6fafe
regular1=ba1a1a
regular2=5d5b7d
regular3=4d616c
regular4=136682
regular5=c7c2ea
regular6=b4cad6
regular7=171c1f
bright0=dce4e9
bright1=ffdad6
bright2=e3dfff
bright3=d0e6f2
bright4=bee9ff
bright5=354a54
bright6=464364
bright7=40484c
# alpha 保持不透明的（1.0）：niri 侧已经没有全局透明度规则了（本仓库自加的
# opacity 0.9 / background-effect 那条 window-rule 已按「照抄上游」删除），
# 终端不透明就是上游默认的样子。Clavis 自己面板的玻璃感来自它的
# shellBackgroundOpacity + ext-background-effect，和终端 alpha 无关。
alpha=1.0
