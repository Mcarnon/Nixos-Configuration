[main]
shell=fish

# iNiR 的终端配色写 ~/.config/foot/colors.ini，这行 include 必须【提前】写好：
# iNiR 生成完会检查 foot.ini 里有没有这行，没有就往里追加 —— 而 foot.ini 是
# 指向 /nix/store 的只读软链，追加会失败（它只会记一条日志，不会弄坏配置）。
include=~/.config/foot/colors.ini

font=JetBrainsMono Nerd Font:size=13.5,Maple Mono NF CN:size=13.5

pad=5x5

# 透明背景（对应 shorin kitty 的 background_opacity 0.8，需 niri blur 生效）。
# 注意：foot 的 alpha 属于 [colors-*] 节，不属于 [main]。
[colors-dark]
alpha=0.8

[cursor]
style=block
unfocused-style=hollow
blink=no
