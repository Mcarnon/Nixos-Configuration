[main]
shell=fish

# 这里刻意【没有】 include colors.ini：Clavis 的 matugen 模板只覆盖
# btop / cava / kitty / yazi / quickshell-colors，不生成 foot 配色。
# 指向 /nix/store 的只读文件被 include 又永远不会被生成，脚本报的还是
# 「include 不存在」的警告。终端配色由 kitty 的 matugen 主题负责。

font=JetBrainsMono Nerd Font:size=13.5,Maple Mono NF CN:size=13.5

pad=5x5

# 透明背景（对应 shorin kitty 的 background_opacity 0.8，需 niri blur 生效）。
# 注意：foot 的 alpha 属于 [colors-*] 节，不属于 [main]。
[colors-dark]
alpha=0.8

[cursor]
style=block
unfocused-style=hollow
blink=no
