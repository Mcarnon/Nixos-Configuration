# Static fallback for the Clavis matugen kitty template.
#
# ~/.config/kitty/themes/Matugen.conf is the *output* of Clavis's matugen run
# (matugen/config.toml -> [templates.kitty]); this file is only the seed that
# the home-manager activation copies in on first login, so kitty has valid
# colors before the first wallpaper/theme regeneration happens. Once Clavis
# runs, the real template output (material you colors) overwrites it.
#
# Keep this in sync with home/files/kitty/current-theme.conf, which is the copy
# kitty.conf actually includes -- the matugen post_hook does
#   cp themes/Matugen.conf current-theme.conf && pkill -USR1 -x kitty
# so both files always end up with identical content.

# Main colors
background            #131316
foreground            #e5e1e6
cursor                #e5e1e6
cursor_text_color     #131316
selection_background  #bec2ff
selection_foreground  #131316
url_color             #94e2d5

# ANSI colors
color0                #131316
color1                #f38ba8
color2                #a6e3a1
color3                #f9e2af
color4                #89b4fa
color5                #f5c2e7
color6                #94e2d5
color7                #bac2de
color8                #444559
color9                #ff8f9a
color10               #a6e3a1
color11               #f9e2af
color12               #89b4fa
color13               #f5c2e7
color14               #94e2d5
color15               #a6adc8

# UI elements
