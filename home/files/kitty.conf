window_padding_width 5
hide_window_decorations yes
background_opacity 0.8
font_family Maple Mono NF CN
font_size 13.5
remember_window_size no
confirm_os_window_close 0
shell fish
cursor_trail 1
cursor_shape block
shell_integration no-cursor

# Clavis 静态兜底配色。Clavis 的 matugen 模板写 themes/Matugen.conf，再用
# post_hook 把它 cp 成 current-theme.conf；kitty.conf 读的是后者（include 在
# 文件末尾，优先级高于上面所有设置）。两个文件都由 clavis 模块用 activation
# 种成可写副本 —— matugen 需要写它们。
include current-theme.conf
